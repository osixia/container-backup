apiVersion: batch/v1
kind: CronJob
metadata:
  name: backups
spec:
  schedule: "30 2 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-job
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 911
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: osixia/backup:develop
              imagePullPolicy: IfNotPresent
              command: [bash, /usr/local/lib/backup/run.sh]
              envFrom:
                - configMapRef:
                    name: backups-settings
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                  add: [DAC_READ_SEARCH]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: recipient
                  mountPath: /age
                  readOnly: true
                - name: published
                  mountPath: /published
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backups-scripts
            - name: recipient
              configMap:
                name: backup-recipient
            - name: published
              persistentVolumeClaim:
                claimName: backups-published
            - name: work
              emptyDir:
                sizeLimit: 20Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
