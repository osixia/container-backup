worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  default_type application/octet-stream;
  server_tokens off;

  server {
    listen 8080;
    root /exports;
    disable_symlinks on;
    rewrite ^/[a-z]+/(.*)$ /$1 last;

    # Chaque instance ne monte que les archives chiffrées de son service.
    location = / {
      autoindex on;
      autoindex_format json;
      limit_except GET { deny all; }
    }

    # Servir les archives complètes et leurs marqueurs, jamais les temporaires.
    location ~ \.tar\.gz\.age(\.sha256)?$ {
      try_files $uri =404;
      limit_except GET { deny all; }
    }

    location / {
      return 404;
    }
  }
}
