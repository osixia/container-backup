apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example-portal
namePrefix: portal-
resources:
- ../common
images:
- name: osixia/backup
  newName: osixia/backup
  newTag: develop
configMapGenerator:
- name: backups-settings
  behavior: merge
  literals:
  - SERVICE=portal
  - RETENTION_DAYS=15
  - SQLITE_FILE=/source/db.sqlite3
  - SQLITE_BACKUP_NAME=db.sqlite3
- name: backups-scripts
  files:
  - capture.sh
labels:
- pairs:
    backup.osixia.net/service: portal
  includeSelectors: true
patches:
- path: cronjob.yaml
- path: export.yaml
